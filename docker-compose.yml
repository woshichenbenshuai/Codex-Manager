services:
  codexmanager:
    container_name: codexmanager
    build:
      context: .
      dockerfile: docker/Dockerfile.all-in-one
    restart: unless-stopped
    init: true
    # NAS Docker panels often create bind-mounted folders with host-only ownership
    # and do not expose chown/chmod controls. Run as root so /data stays writable.
    user: "0:0"
    environment:
      CODEXMANAGER_SERVICE_ADDR: 0.0.0.0:48760
      CODEXMANAGER_WEB_ADDR: 0.0.0.0:48761
      CODEXMANAGER_WEB_PUBLIC_BASE_URL: ${CODEXMANAGER_WEB_PUBLIC_BASE_URL:?Set the public HTTPS URL, for example https://codex.example.com}
      CODEXMANAGER_WEB_NO_OPEN: "1"
      TZ: ${TZ:-Asia/Shanghai}
      CODEXMANAGER_DB_PATH: /data/codexmanager.db
      CODEXMANAGER_RPC_TOKEN_FILE: /data/codexmanager.rpc-token
      CODEXMANAGER_WEB_BOOTSTRAP_PASSWORD: ${CODEXMANAGER_WEB_BOOTSTRAP_PASSWORD:?Set a one-time bootstrap password}
      CODEXMANAGER_WEB_TOTP_ENCRYPTION_KEY: ${CODEXMANAGER_WEB_TOTP_ENCRYPTION_KEY:?Set a stable 32-byte Base64 or 64-hex TOTP key}
      CODEXMANAGER_WEB_TRUSTED_PROXY_CIDRS: ${CODEXMANAGER_WEB_TRUSTED_PROXY_CIDRS:-}
      CODEXMANAGER_GATEWAY_TRACE_STDOUT: "1"
      CODEXMANAGER_GATEWAY_ERROR_STDOUT: "1"
      # Optional mitigation for same key/path/model head-of-line gate waits:
      # CODEXMANAGER_REQUEST_GATE_WAIT_TIMEOUT_MS: "5000"
      # If the host machine provides an HTTP proxy, use:
      # CODEXMANAGER_UPSTREAM_PROXY_URL: http://host.docker.internal:7890
    volumes:
      # For normal Linux servers you can also run as UID/GID 10001 and chown this
      # folder, but NAS environments such as ZSpace are usually easier with root.
      - ./data:/data
    ports:
      # This root/NAS deployment intentionally keeps Web port 17000 externally
      # reachable. Terminate HTTPS in front of it and restrict inbound traffic
      # at the firewall or load balancer. Internal service port 48760 is not
      # published.
      - "${CODEXMANAGER_WEB_PUBLISH_HOST:-0.0.0.0}:17000:48761"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    stop_grace_period: 20s
